<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="陈硕 KAI · AI Builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0D12"/>
      <stop offset="1" stop-color="#11151C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
      .mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="19.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <text x="72" y="92" class="mono" font-size="15" fill="#8B949E" letter-spacing="2">~/chenshuo2004 $ whoami</text>

  <text x="70" y="168" class="sans" font-size="64" font-weight="700" fill="#F0F6FC">陈硕 <tspan fill="#58A6FF">KAI</tspan></text>

  <text x="72" y="214" class="sans" font-size="22" fill="#C9D1D9">把真实项目，变成可复用的 AI 工作流。</text>

  <text x="72" y="262" class="mono" font-size="15" fill="#8B949E">AI Builder · Creator · Skill Maker<tspan class="cursor" fill="#58A6FF"> ▍</tspan></text>

  <g class="mono" font-size="14" fill="#8B949E">
    <rect x="818" y="196" width="310" height="84" rx="12" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="842" y="228"><tspan fill="#7EE787">●</tspan>  building in public</text>
    <text x="842" y="256"><tspan fill="#58A6FF">→</tspan>  idea · build · ship · repeat</text>
  </g>
</svg>
