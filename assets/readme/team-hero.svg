<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
<title id="title">Warmth Lab animated neuro AI laboratory</title>
<desc id="desc">Code-generated animated blue neurotechnology laboratory with holographic brain scans, medical interfaces, glowing test tubes, and an AI workstation.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#020b1d"/><stop offset=".55" stop-color="#062451"/><stop offset="1" stop-color="#031327"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b5490" stop-opacity=".76"/><stop offset="1" stop-color="#03122d" stop-opacity=".88"/></linearGradient>
<linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#00cfff" stop-opacity="0"/><stop offset=".5" stop-color="#31f5ff"/><stop offset="1" stop-color="#00a3ff" stop-opacity="0"/></linearGradient>
<linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#72fbff"/><stop offset=".6" stop-color="#0bd9ff"/><stop offset="1" stop-color="#067dcc"/></linearGradient>
<radialGradient id="brain"><stop stop-color="#d7ffff"/><stop offset=".28" stop-color="#42eaff"/><stop offset=".72" stop-color="#068dff" stop-opacity=".8"/><stop offset="1" stop-color="#0067cc" stop-opacity=".06"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="bigGlow"><feGaussianBlur stdDeviation="20"/></filter>
<pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#47cfff" stroke-opacity=".12"/></pattern>
<clipPath id="frame"><rect width="1400" height="620" rx="24"/></clipPath>
<style>
.breathe{animation:breathe 3s ease-in-out infinite}.breathe2{animation:breathe 4.5s ease-in-out -1s infinite}.float{animation:float 6s ease-in-out infinite}.float2{animation:float 7s ease-in-out -2s infinite}.flow{stroke-dasharray:20 18;animation:flow 2.6s linear infinite}.flow2{stroke-dasharray:10 18;animation:flow 3.8s linear reverse infinite}.scan{animation:scan 5.5s linear infinite}.bubble{animation:bubble 3s ease-in-out infinite}.bubble2{animation:bubble 4s ease-in-out -1.2s infinite}.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
@keyframes breathe{0%,100%{opacity:.42;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes flow{to{stroke-dashoffset:-76}}@keyframes scan{0%{transform:translateY(-180px);opacity:0}15%,80%{opacity:.7}100%{transform:translateY(700px);opacity:0}}@keyframes bubble{0%,100%{transform:translateY(8px);opacity:.25}50%{transform:translateY(-8px);opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.breathe,.breathe2,.float,.float2,.flow,.flow2,.scan,.bubble,.bubble2,.spin{animation:none}}
</style>
</defs>
<g clip-path="url(#frame)">
<rect width="1400" height="620" fill="url(#bg)"/><rect width="1400" height="620" fill="url(#grid)"/>
<path d="M0 450Q250 420 500 450T1000 450T1400 450V620H0Z" fill="#020c20" opacity=".9"/>
<g opacity=".2" stroke="#5edfff" fill="none"><path d="M0 458H1400"/><path d="M0 510H1400"/><path d="M100 620L405 450M1300 620L995 450"/></g>

<!-- floating neuro scan monitors -->
<g class="float" transform="translate(75 46)">
<rect width="355" height="220" rx="12" fill="url(#panel)" stroke="#46dcff" stroke-width="2"/>
<rect x="18" y="18" width="319" height="184" fill="#03132e" stroke="#1bbce9" stroke-opacity=".5"/>
<g class="breathe" transform="translate(178 105)">
<path d="M0-74C-38-106-89-70-76-20C-88 24-52 67-8 55C-3 84 21 84 25 52C71 68 89 18 72-20C83-70 35-108 0-74Z" fill="url(#brain)" stroke="#46efff" stroke-width="2" filter="url(#glow)"/>
<path d="M0-67V62M-60-28C-20-9-20 18-55 38M58-27C20-5 21 18 55 40M-22-65C8-30 6 0-23 28M28-67C-4-35-2 0 26 27" fill="none" stroke="#b0ffff" stroke-width="2" opacity=".86" class="flow"/>
<circle r="5" fill="#fff" filter="url(#glow)"/>
</g>
<path d="M25 178H96M25 188H70M270 180h45M270 190h28" stroke="#75f6ff" stroke-width="2" opacity=".6"/>
<text x="24" y="39" fill="#a5f8ff" font-family="monospace" font-size="11" letter-spacing="2">NEURAL SCAN / 01</text>
</g>

<g class="float2" transform="translate(970 46)">
<rect width="355" height="220" rx="12" fill="url(#panel)" stroke="#46dcff" stroke-width="2"/>
<rect x="18" y="18" width="319" height="184" fill="#03132e" stroke="#1bbce9" stroke-opacity=".5"/>
<g transform="translate(177 106)" fill="none" stroke="#38e5ff">
<ellipse rx="115" ry="70" opacity=".55"/><ellipse rx="82" ry="70" opacity=".65"/><ellipse rx="45" ry="70" opacity=".8"/>
<path d="M-115 0H115M0-70V70" stroke-dasharray="4 8" class="flow2"/>
<path d="M-68-42C-30-12-30 13-65 43M68-42C30-12 30 13 65 43" stroke-width="3" class="flow"/>
<circle r="15" fill="#20e5ff" opacity=".35" filter="url(#glow)"/><circle r="4" fill="#d4ffff"/>
</g>
<text x="24" y="39" fill="#a5f8ff" font-family="monospace" font-size="11" letter-spacing="2">COGNITION MAP / 02</text>
</g>

<!-- central floating brain hologram -->
<g transform="translate(700 166)">
<ellipse rx="230" ry="125" fill="#00bfff" opacity=".13" filter="url(#bigGlow)" class="breathe"/>
<g class="spin" fill="none" stroke="#37eaff" stroke-width="1" opacity=".55"><ellipse rx="210" ry="98"/><ellipse rx="170" ry="118"/><path d="M-210 0H210M0-118V118"/></g>
<g class="breathe2">
<path d="M0-108C-50-145-127-103-112-38C-130 16-78 95-10 75C-2 112 23 112 31 70C98 96 139 19 110-39C127-101 52-145 0-108Z" fill="url(#brain)" stroke="#5ff5ff" stroke-width="3" filter="url(#glow)"/>
<path d="M0-99V76M-87-45C-41-24-45 3-89 36M83-46C40-20 42 5 88 35M-32-92C12-52 11-11-32 29M37-94C-8-52-5-12 35 30M-75-73C-36-64-28-48-38-28M73-73C34-64 28-48 37-28" fill="none" stroke="#d2ffff" stroke-width="3" class="flow"/>
<g fill="#a5ffff" filter="url(#glow)"><circle cx="-87" cy="-45" r="5"/><circle cx="83" cy="-46" r="5"/><circle cx="0" cy="-99" r="5"/><circle cx="0" cy="76" r="5"/></g>
</g>
<path d="M-270 130H270" stroke="#36eaff" opacity=".65" class="flow"/><text x="-100" y="157" fill="#b4ffff" font-family="monospace" font-size="12" letter-spacing="3">BIO / AI CORE</text>
</g>

<!-- lab bench and glassware -->
<g transform="translate(0 350)">
<rect y="104" width="1400" height="22" fill="#0a4a79" stroke="#45eaff" stroke-width="2"/>
<rect y="126" width="1400" height="38" fill="#031629"/>
<g stroke="#33dcff" fill="none">
<path d="M0 164H1400" stroke-width="2"/><path d="M150 164V220M400 164V220M1000 164V220M1250 164V220" opacity=".4"/>
</g>
<!-- left test tubes -->
<g transform="translate(72 10)" stroke="#88fbff" stroke-width="2">
<path d="M0 0V111Q0 130 18 130T36 111V0Z" fill="#07365b" fill-opacity=".65"/><path d="M0 58V111Q0 130 18 130T36 111V58Z" fill="url(#liquid)" opacity=".9"/><path d="M-2 0H38" stroke-width="8"/>
<path d="M58 22V111Q58 130 76 130T94 111V22Z" fill="#07365b" fill-opacity=".65"/><path d="M58 75V111Q58 130 76 130T94 111V75Z" fill="url(#liquid)" opacity=".9"/><path d="M56 22H96" stroke-width="8"/>
<path d="M116 0V111Q116 130 134 130T152 111V0Z" fill="#07365b" fill-opacity=".65"/><path d="M116 65V111Q116 130 134 130T152 111V65Z" fill="url(#liquid)" opacity=".9"/><path d="M114 0H154" stroke-width="8"/>
</g>
<!-- right bottles -->
<g transform="translate(1080 0)" stroke="#88fbff" stroke-width="2">
<path d="M18 0H55V35L78 70V118Q78 140 37 140T-4 118V70L18 35Z" fill="#08375d" fill-opacity=".7"/><path d="M-3 83H77V118Q77 140 37 140T-3 118Z" fill="url(#liquid)" opacity=".85"/><path d="M6 18H66" opacity=".5"/>
<path d="M112 16H143V53L162 78V118Q162 137 128 137T94 118V78L112 53Z" fill="#08375d" fill-opacity=".7"/><path d="M94 90H162V118Q162 137 128 137T94 118Z" fill="url(#liquid)" opacity=".85"/>
</g>
<!-- center workstation -->
<g transform="translate(420 62)">
<path d="M0 40L45 0H515L560 40V108H0Z" fill="#061a31" stroke="#41eaff" stroke-width="2"/>
<rect x="32" y="13" width="496" height="84" rx="5" fill="#031a38" stroke="#0ec8f0"/>
<g stroke="#32eaff" fill="none" opacity=".8"><path d="M60 73C130 20 176 80 250 38S370 15 468 66" class="flow"/><path d="M60 81H210M380 81H486" stroke-dasharray="3 8"/><circle cx="250" cy="38" r="9" class="breathe"/></g>
<path d="M220 108H340L380 175H180Z" fill="#0c4771" stroke="#42eaff" stroke-width="2"/><path d="M185 175H375L415 184H145Z" fill="#092a49" stroke="#42eaff" stroke-width="2"/>
</g>
<!-- bubbles -->
<g fill="#b5ffff" filter="url(#glow)"><circle cx="112" cy="420" r="4" class="bubble"/><circle cx="145" cy="397" r="3" class="bubble2"/><circle cx="190" cy="432" r="3" class="bubble"/><circle cx="1140" cy="424" r="3" class="bubble2"/><circle cx="1180" cy="399" r="4" class="bubble"/></g>
</g>
<rect x="0" y="-100" width="1400" height="3" fill="url(#cyan)" class="scan"/>
<g fill="#9df8ff" font-family="monospace" font-size="12" letter-spacing="2" opacity=".72"><text x="48" y="594">WARMTH LAB / NEURO-AI RESEARCH</text><text x="1140" y="594">STATUS: RUNNING</text></g>
</g></svg>