<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">有温度团队 Warmth Team</title>
  <desc id="desc">A premium dark hero banner for Warmth Team, an open-source AI product team.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="0.52" stop-color="#101827"/>
      <stop offset="1" stop-color="#18110B"/>
    </linearGradient>
